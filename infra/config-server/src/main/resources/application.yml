server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # Пути считаются от рабочей директории запуска (корень проекта)
          search-locations:
            - file:./infra/config-repo
            - file:./infra/config-repo/telemetry
