syntax = "proto3";

package telemetry.message.event;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ru.yandex.practicum.grpc.telemetry.event";

// ===== Тип устройства =====
enum DeviceTypeProto {
    DEVICE_TYPE_UNSPECIFIED = 0;
    MOTION_SENSOR      = 1;
    TEMPERATURE_SENSOR = 2;
    LIGHT_SENSOR       = 3;
    CLIMATE_SENSOR     = 4;
    SWITCH_SENSOR      = 5;
}

// ===== Тип условия сценария =====
enum ConditionTypeProto {
    CONDITION_TYPE_UNSPECIFIED = 0;
    MOTION      = 1;
    LUMINOSITY  = 2;
    SWITCH      = 3;
    TEMPERATURE = 4;
    CO2LEVEL    = 5;
    HUMIDITY    = 6;
}

// ===== Операция сравнения =====
enum ConditionOperationProto {
    CONDITION_OPERATION_UNSPECIFIED = 0;
    EQUALS        = 1;
    GREATER_THAN  = 2;
    LOWER_THAN    = 3;
}

// ===== Тип действия =====
enum ActionTypeProto {
    ACTION_TYPE_UNSPECIFIED = 0;
    ACTIVATE   = 1;
    DEACTIVATE = 2;
    INVERSE    = 3;
    SET_VALUE  = 4;
}

// ===== Устройство добавлено =====
message DeviceAddedEventProto {
    string id = 1;
    DeviceTypeProto type = 2;
}

// ===== Устройство удалено =====
message DeviceRemovedEventProto {
    string id = 1;
}

// ===== Условие сценария =====
message ScenarioConditionProto {
    string sensor_id = 1;
    ConditionTypeProto type = 2;
    ConditionOperationProto operation = 3;

    // Аналог union { null, int, boolean } — одно из трёх
    oneof value {
        int32 int_value = 4;
        bool  bool_value = 5;
        // null = ни одно поле не установлено
    }
}

// ===== Действие устройства =====
message DeviceActionProto {
    string sensor_id = 1;
    ActionTypeProto type = 2;
    optional int32 value = 3;   // null, если не задано
}

// ===== Сценарий добавлен =====
message ScenarioAddedEventProto {
    string name = 1;
    repeated ScenarioConditionProto conditions = 2;
    repeated DeviceActionProto actions = 3;
}

// ===== Сценарий удалён =====
message ScenarioRemovedEventProto {
    string name = 1;
}

// ===== Общее событие хаба =====
message HubEventProto {
    string hub_id = 1;
    google.protobuf.Timestamp timestamp = 2;

    oneof payload {
        DeviceAddedEventProto    device_added_event    = 3;
        DeviceRemovedEventProto  device_removed_event  = 4;
        ScenarioAddedEventProto  scenario_added_event  = 5;
        ScenarioRemovedEventProto scenario_removed_event = 6;
    }
}