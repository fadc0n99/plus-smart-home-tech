syntax = "proto3";

package telemetry.message.event;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ru.yandex.practicum.grpc.telemetry.event";

// ===== Тип события датчика =====
enum SensorEventType {
    MOTION_SENSOR_EVENT = 0;
    TEMPERATURE_SENSOR_EVENT = 1;
    LIGHT_SENSOR_EVENT = 2;
    CLIMATE_SENSOR_EVENT = 3;
    SWITCH_SENSOR_EVENT = 4;
}

// ===== Общее событие датчика =====
message SensorEventProto {
    string id = 1;
    string hub_id = 2;
    google.protobuf.Timestamp timestamp = 3;
    SensorEventType type = 4;

    oneof payload {
        MotionSensorEventProto      motion_sensor_event      = 5;
        TemperatureSensorEventProto temperature_sensor_event = 6;
        LightSensorEventProto       light_sensor_event       = 7;
        ClimateSensorEventProto     climate_sensor_event     = 8;
        SwitchSensorEventProto      switch_sensor_event      = 9;
    }
}

message MotionSensorEventProto {
    int32 link_quality = 1;
    bool  motion       = 2;
    int32 voltage      = 3;
}

message TemperatureSensorEventProto {
    int32 temperature_c = 1;
    int32 temperature_f = 2;
}

message LightSensorEventProto {
    int32 link_quality = 1;
    int32 luminosity   = 2;
}

message ClimateSensorEventProto {
    int32 temperature_c = 1;
    int32 humidity      = 2;
    int32 co2_level     = 3;
}

message SwitchSensorEventProto {
    bool state = 1;
}